name: GitHub Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: RiverBoy26
          filename: metrics.plugin.isocalendar.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Translate generated SVG to Russian
        run: |
          cp /metrics_renders/metrics.plugin.isocalendar.svg ./metrics.plugin.isocalendar.svg
          python3 scripts/translate_metrics.py metrics.plugin.isocalendar.svg

      - name: Commit translated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.isocalendar.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Russian isometric calendar [skip ci]"
            git push
          else
            echo "Calendar is already up to date"
          fi
